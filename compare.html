<!DOCTYPE html>
<!-- thought up by human, coded by ai -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://wms.geonorge.no https://ideihm.covam.es https://idecan1.grafcan.es https://ows.emodnet-bathymetry.eu; connect-src 'self' https://wms.geonorge.no https://ideihm.covam.es https://idecan1.grafcan.es https://ows.emodnet-bathymetry.eu;">
  <title>SeaGlimpse – Dienste-Prüfstand</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #101418; color: #e6eaef;
                 font: 13px/1.45 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    #bar { padding: .5rem; background: #1b2127; display: flex; flex-wrap: wrap;
           gap: .5rem; align-items: center; flex: 0 0 auto; }
    select, button { font: inherit; padding: .45rem .7rem; background: #252c33;
                     color: #e6eaef; border: 1px solid #3a444e; border-radius: 8px; }
    button { font-weight: 600; color: #4fe3b0; }
    #map { flex: 1 1 auto; min-height: 180px; background: #0a141d; }
    #previews { display: flex; gap: .5rem; padding: .5rem; overflow-x: auto;
                background: #0a141d; flex: 0 0 auto; }
    .preview { margin: 0; flex: 0 0 auto; text-align: center; font-size: 10px;
               color: #a8b4bf; }
    /* Checkerboard, so transparent parts of a tile look transparent instead of
       black - the whole question is what is drawn and what is not. */
    .tile {
      width: 128px; height: 128px; display: block; border-radius: 6px;
      background-color: #cfd6dd;
      background-image:
        linear-gradient(45deg, #9aa4ad 25%, transparent 25%, transparent 75%, #9aa4ad 75%),
        linear-gradient(45deg, #9aa4ad 25%, transparent 25%, transparent 75%, #9aa4ad 75%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }
    #log { padding: .5rem; background: #0a141d; font-size: 11px; height: 16rem;
           overflow: auto; flex: 0 0 auto; white-space: pre-wrap; margin: 0;
           font-family: ui-monospace, monospace; }
    .bad { color: #ff6b6b; } .ok { color: #4fe3b0; } .warn { color: #ffb703; }
    .hl { color: #ffb703; font-weight: 600; }
    #hint { padding: .4rem .5rem; background: #252c33; font-size: 11px; flex: 0 0 auto; }
  </style>
</head>
<body>

<div id="bar">
  <label for="place-select">Ort:</label>
  <select id="place-select"></select>
  <button id="btn-locate">Eigene Position</button>
  <label for="layer-select">Vorschau:</label>
  <select id="layer-select">
    <option value="">– keine –</option>
  </select>
  <button id="btn-probe">Dienste prüfen</button>
  <span id="zoominfo"></span>
</div>

<div id="hint">Zu der Stelle fahren, die geprüft werden soll, dann
  <strong>Dienste prüfen</strong>. Getestet werden Erreichbarkeit, CORS,
  Layernamen aus den Capabilities, die angegebene Abdeckung, EPSG:3857 – und
  was jeder Dienst an dieser Stelle tatsächlich zeichnet. Die Vorschau zeigt
  den Dienst <em>ohne</em> Blend-Modus und Filter.</div>

<div id="map"></div>
<div id="previews"></div>
<pre id="log"></pre>

<script src="vendor/leaflet.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
