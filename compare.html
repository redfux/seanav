<!DOCTYPE html>
<!-- thought up by human, coded by ai -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cache.kartverket.no https://wms.geonorge.no; connect-src 'self' https://cache.kartverket.no https://wms.geonorge.no;">
  <title>SeeNavi – WMTS vs. WMS</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0d1b2a; color: #e6edf3;
                 font: 14px/1.4 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    #controls { padding: .5rem; background: #10202c; display: flex; flex-wrap: wrap;
                gap: .5rem; align-items: center; flex: 0 0 auto; }
    #controls label { font-size: 12px; }
    select, button { font: inherit; padding: .3rem; background: #16222e; color: #e6edf3;
                     border: 1px solid #2a3f52; border-radius: 4px; }
    #maps { flex: 1 1 auto; display: grid; grid-template-rows: 1fr 1fr; gap: 2px; min-height: 0; }
    @media (min-width: 800px) { #maps { grid-template-rows: none; grid-template-columns: 1fr 1fr; } }
    .pane { position: relative; min-height: 0; }
    .pane .map { position: absolute; inset: 0; background: #0a141d; }
    .pane .tag { position: absolute; z-index: 500; top: .4rem; left: .4rem;
                 background: rgba(13,27,42,.85); padding: .2rem .5rem; border-radius: 4px;
                 font-size: 12px; font-weight: 600; }
    #status { padding: .4rem .5rem; background: #0a141d; font-size: 11px;
              max-height: 7rem; overflow: auto; flex: 0 0 auto; white-space: pre-wrap; }
    .bad { color: #ff6b6b; } .ok { color: #06d6a0; }
  </style>
</head>
<body>

<div id="controls">
  <label for="wms-layer">WMS-Layer:</label>
  <select id="wms-layer"><option>lädt…</option></select>
  <label for="wms-format">Format:</label>
  <select id="wms-format"></select>
  <button id="btn-locate">Eigene Position</button>
  <span id="zoominfo"></span>
</div>

<div id="maps">
  <div class="pane">
    <div class="tag">WMTS (aktuell) – <span id="tag-left-z"></span></div>
    <div class="map" id="map-left"></div>
  </div>
  <div class="pane">
    <div class="tag">WMS sjokartraster2 – <span id="tag-right-z"></span></div>
    <div class="map" id="map-right"></div>
  </div>
</div>

<pre id="status">läuft…</pre>

<script src="vendor/leaflet.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
